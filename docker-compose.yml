# Slow Henry + Postgres/pgvector. See "Running with Docker" in README.md.
#
#   cp .env.example .env              # then set SECRET_KEY_BASE (and the rest)
#   docker compose up -d              # then pick the sources at /sources/edit
#
# Compose reads .env both for the ${...} values below and for the app's own
# environment (env_file), so the database credentials are defined once.
services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-slow_henry}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Pin a version (e.g. 0.2.0, or 0.2 for patch updates) rather than latest.
    image: ghcr.io/bemble/slow-henry:${SLOW_HENRY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-slow_henry}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env (mix phx.gen.secret or openssl rand -base64 48)}
      PHX_HOST: ${PHX_HOST:-localhost}
      # PORT in .env only changes the host side of the mapping below.
      PORT: 4000
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      # sources.toml (edited from /sources/edit), secrets.toml, git mirrors,
      # the embedding model cache.
      - app-data:/var/lib/retrieval_node

  # Optional: embeddings on Ollama instead of the in-process CPU model. Uncomment,
  # set OLLAMA_ENDPOINT=http://ollama:11434 in .env, then
  # `docker compose exec ollama ollama pull nomic-embed-text`.
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  db-data:
  app-data:
  # ollama-data:
