# Sources indexed by Slow Henry (git repos, Jira projects, Google Drive).
# Copy to DATA_DIR/sources.toml (data/sources.toml in dev, git-ignored). The
# server applies it at start and whenever it changes; `mix rn.sources
# --dry-run` previews. SOURCES_FILE=path points at another file.
#
# Removing an entry deactivates the source (its chunks stay searchable);
# `active = false` does the same while keeping it listed here.
# Format and rules: RetrievalNode.SourcesFile.

[[git]]
name = "my-repo"                                  # mirror slug + MCP `repo` filter
url = "https://github.com/my-org/my-repo.git"     # clone URL (the source identity)

[[git]]
name = "old-repo"
url = "https://github.com/my-org/old-repo.git"
active = false

# A big repo, keeping only part of it, plus the messages of its merged PRs.
# `exclude` is .gitignore-style: `*` stays in one segment, `**` crosses them,
# a directory covers its whole tree, `!` re-includes, the last match wins.
[[git]]
name = "core"
url = "https://github.com/home-assistant/core.git"
exclude = ["homeassistant/components/*", "!homeassistant/components/cloud"]
pull_requests = true   # merged PRs: description, comments, reviews (default false)

# Jira: the resolved issues (status category Done) of a project, by its key:
# summary, description, type and status, plus the fields turned on below.
# Connect Jira (site, email, API token) on the Settings page first.
[[jira]]
project = "CLOUD"
assignee = true   # also index the assignee (default false)
reporter = true   # also index the reporter (default false)
parent = true     # also index the parent issue, e.g. the epic (default false)

# Google Drive: Docs you own, optionally the Docs shared directly with you,
# plus the shared drives / folders listed in `include` (ids from their URLs,
# e.g. drive.google.com/drive/folders/<ID>; folders shared with you are only
# crawled when listed there).
# Docs are then filtered by their Drive labels: every `include_labels` filter
# must pass. A doc passes one when the label's selected choice(s) are all in
# `values`, or when it doesn't carry the label and `unlabeled = true`.
# Without `include_labels`, the filter is the "Classification" one below;
# `include_labels = []` indexes every doc in scope.
# Authorize once from the UI's Settings page (/settings).
[drive]
my_drive = true
shared_with_me = false
include = ["0AbCdEfGhIjKlMnOpQ", "1aBcDeFgHiJkLmNoPqRsTuVwXyZ"]

[[drive.include_labels]]
label = "Classification"
values = ["Public", "Internal"]
unlabeled = true

